services:
  connector-mitre:
    image: ghcr.io/opencti-platform/opencti/connector-mitre:7.261124.0@sha256:d80cb96c3184cc4bbfacec8fb1fe726015d44abbe88983ee472ba2d0c9fe49b9
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 256m
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${CONNECTOR_MITRE_TOKEN:?CONNECTOR_MITRE_TOKEN is required}
      CONNECTOR_ID: ${CONNECTOR_MITRE_ID:?CONNECTOR_MITRE_ID is required}
      CONNECTOR_NAME: MITRE ATT&CK
      CONNECTOR_LOG_LEVEL: info
      MITRE_INTERVAL: "7"
    depends_on:
      opencti:
        condition: service_healthy
