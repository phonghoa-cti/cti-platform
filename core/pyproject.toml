[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonghoa-core"
version = "0.1.0"
description = "Thư viện lõi của Phong Hỏa: chuẩn hóa IOC, trích IOC bằng regex, chấm điểm, allowlist"
requires-python = ">=3.11"
dependencies = []  # cố ý không phụ thuộc thư viện ngoài để dễ cài và dễ hiểu

[tool.setuptools.packages.find]
include = ["phonghoa_core*"]
